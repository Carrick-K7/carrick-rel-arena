name: Verify and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: relationship-arena-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify

      - name: Package release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir release
          cp -R dist public package.json package-lock.json release/
          npm ci --omit=dev --prefix release
          node -e 'require("fs").writeFileSync("release/manifest.json", JSON.stringify({ schemaVersion: 1, revision: process.env.RELEASE_SHA }, null, 2) + "\n")'
          test "$(node -p 'require("./release/manifest.json").revision')" = "$RELEASE_SHA"
          tar -C release -czf release.tar.gz .
          tar -tzf release.tar.gz

      - name: Deploy through restricted SSH command
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $REVISION" < release.tar.gz

      - name: Smoke test production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://games.carrick7.com/rel-arena/api/health \
            --output /tmp/relationship-arena-health.json
          curl --fail --silent --show-error --location \
            https://games.carrick7.com/rel-arena/ \
            --output /tmp/relationship-arena-index.html
          grep -q '<div id="root">' /tmp/relationship-arena-index.html

      - name: Remove deploy key
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: rm -f ~/.ssh/deploy_key
